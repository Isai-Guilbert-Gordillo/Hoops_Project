name: keep-alive

# Render free duerme el servicio tras ~15 min sin tráfico (arrancar de nuevo
# tarda ~50s). Este job lo pinga cada 10 min para mantenerlo despierto.
#
# El ping es EXTERNO a Render a propósito: un self-ping dentro del server no
# funciona, porque una vez dormido no hay proceso que lo dispare.

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 min (margen bajo el spindown de 15 min)
  workflow_dispatch:          # permite dispararlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # --max-time 60: si estaba dormido, el arranque en frío tarda hasta ~50s.
      - run: curl -fsS --max-time 60 https://hoops-project.onrender.com/ > /dev/null
