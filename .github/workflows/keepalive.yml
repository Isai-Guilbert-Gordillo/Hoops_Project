# Mantiene despierta la instancia gratis de Render.
#
# El plan Free de Render duerme tras ~15 min sin tráfico; al despertar tarda
# ~50s y puede servir 404 transitorios en CSS/JS (la página se ve "sin estilos").
# Este workflow le hace un ping cada 5 minutos para que nunca se duerma, así
# quien abra el enlace siempre la ve al instante y con estilos.
name: Keep Render awake

on:
  schedule:
    # Cada 5 minutos. GitHub a veces retrasa los cron; 5 min da margen frente al
    # umbral de 15 min de Render.
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping al sitio
        run: |
          echo "Ping $(date -u)"
          curl -sSf --retry 2 --max-time 90 -o /dev/null \
            https://hoops-project.onrender.com/ \
            && echo "OK: sitio despierto" \
            || (echo "Ping falló (puede ser arranque en frío); reintentará en 5 min" && exit 0)
