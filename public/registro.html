<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Retro Hoops</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
    <header>
        <a href="/" class="logo">RETRO HOOPS</a>
    </header>

    <div class="container-narrow fade-in-up">
        <h1><span class="float-ball">🏀</span> CREAR CUENTA</h1>
        <form id="register-form">
            <div class="form-group">
                <label for="firstName">Nombre</label>
                <input type="text" id="firstName" name="firstName" required>
            </div>

            <div class="form-group">
                <label for="lastName">Apellido</label>
                <input type="text" id="lastName" name="lastName" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn-submit">Registrarse</button>
        </form>
        <a href="/login.html" class="back-link">¿Ya tienes cuenta? Inicia sesión</a>
    </div>

    <script src="/toast.js"></script>
    <script>
        const form = document.getElementById('register-form');
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json().then(json => ({ status: res.status, json })))
            .then(({ status, json }) => {
                if (status === 201) {
                    showToast('Usuario registrado con éxito. Redirigiendo a Login...', 'success');
                    setTimeout(() => window.location.href = '/login.html', 1500);
                } else {
                    showToast('Error: ' + json.error, 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showToast('Error de red', 'error');
            });
        });
    </script>
</body>
</html>
