<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Inscritos - Retro Hoops</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <script src="/toast.js"></script>
</head>
<body>
    <header>
        <a href="/" class="logo">RETRO HOOPS</a>
        <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-wrapper" id="nav-wrapper">
            <nav class="main-nav">
                <a href="/">Inicio</a>
                <a href="/ligas.html">Ligas</a>
                <a href="/franquicias.html">Franquicias</a>
                <a href="/estadisticas.html">Estadísticas</a>
            </nav>
        </div>
    </header>

    <div class="container-narrow">
        <h1 class="page-title fade-in-up">Gestión de <span>Inscritos</span></h1>
        <h3 id="tournament-name" class="page-subtitle fade-in-up" style="text-align:center;">Cargando torneo...</h3>

        <div class="table-wrap reveal">
            <table class="kp-table">
                <thead>
                    <tr>
                        <th>Equipo</th>
                        <th>Estado</th>
                        <th>Fecha de Registro</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="enrollments-body">
                    <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Cargando equipos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer class="site-footer">
        <span class="footer-logo">RETRO HOOPS</span>
        <div class="footer-links">
            <a href="/">Inicio</a>
            <a href="/franquicias.html">Franquicias</a>
            <a href="/estadisticas.html">Estadísticas</a>
        </div>
        <p>&copy; 2026 Retro Hoops. Todos los derechos reservados.</p>
    </footer>

    <script src="/js/nav.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const tournamentId = urlParams.get('tournamentId');
            const token = localStorage.getItem('kphoops_token');

            if (!tournamentId || !token) {
                showToast('Acceso denegado', 'error');
                setTimeout(() => window.location.href = '/', 1500);
                return;
            }

            try {
                const res = await fetch(`/api/tournaments/${tournamentId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) throw new Error('Error al cargar torneo');

                const tournament = await res.json();
                document.getElementById('tournament-name').innerText = tournament.name;

                const tbody = document.getElementById('enrollments-body');
                tbody.innerHTML = '';

                if (!tournament.enrollments || tournament.enrollments.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No hay equipos inscritos aún</td></tr>';
                    return;
                }

                tournament.enrollments.forEach(enroll => {
                    const tr = document.createElement('tr');
                    const d = new Date(enroll.createdAt);
                    const formattedDate = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                    tr.innerHTML = `
                        <td style="font-weight: 600;">${enroll.team.name}</td>
                        <td style="color: var(--cyan-accent);">${enroll.status}</td>
                        <td style="color: var(--text-muted); font-size: 0.9rem;">${formattedDate}</td>
                        <td>
                            <button class="btn btn-danger btn-sm" onclick="removeEnrollment('${enroll.id}')"><span class="btn-content">Dar de Baja</span></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error(error);
                showToast(error.message, 'error');
            }
        });

        async function removeEnrollment(enrollmentId) {
            if (!confirm("⚠️ ADVERTENCIA: ¿Estás seguro de que deseas eliminar la inscripción de este equipo del torneo?")) {
                return;
            }

            const token = localStorage.getItem('kphoops_token');
            try {
                const res = await fetch(`/api/enrollments/${enrollmentId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Error al eliminar');

                showToast('Equipo eliminado del torneo exitosamente', 'success');
                setTimeout(() => window.location.reload(), 1000);
            } catch (error) {
                showToast(error.message, 'error');
            }
        }
    </script>
</body>
</html>
