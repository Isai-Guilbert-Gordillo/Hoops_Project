<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Control - KP Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        /* ==========================================================================
           Mesa de Control — Marcador arcade (elementos específicos de esta página)
           ========================================================================== */

        html, body { height: 100%; }

        body {
            display: flex;
            flex-direction: column;
            overflow: hidden; /* App-like: sin scroll de página */
        }

        /* Header compacto — sala de control, la protagonista es el marcador */
        header {
            padding: 0.75rem 1.5rem;
            flex-wrap: wrap;
            row-gap: 0.75rem;
        }

        /* Marcador Central */
        .scoreboard-bar {
            width: 100%;
            background: linear-gradient(160deg, var(--card-bg), var(--card-bg-2));
            border-bottom: 2px solid var(--orange);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
            padding: 1rem 1.5rem;
        }

        .scoreboard {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            gap: 1rem;
        }

        .team-score {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            transition: box-shadow var(--transition);
        }

        .team-score.home {
            box-shadow: inset 0 0 0 1px rgba(255, 106, 0, 0.25), 0 0 25px rgba(255, 106, 0, 0.12);
        }

        .team-score.away {
            box-shadow: inset 0 0 0 1px rgba(0, 240, 255, 0.25), 0 0 25px rgba(0, 240, 255, 0.12);
        }

        .team-name {
            font-family: var(--font-arcade);
            font-size: 1rem;
            text-align: center;
            margin-bottom: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .team-score.home .team-name {
            color: var(--orange);
            text-shadow: 0 0 12px var(--orange-glow);
        }

        .team-score.away .team-name {
            color: var(--cyan-accent);
            text-shadow: 0 0 12px var(--cyan-glow);
        }

        .score-number {
            font-family: var(--font-arcade);
            font-size: 4.2rem;
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .team-score.home .score-number {
            color: var(--orange-2);
            text-shadow: 0 0 10px var(--orange-glow), 0 0 30px var(--orange-glow);
        }

        .team-score.away .score-number {
            color: var(--cyan-accent);
            text-shadow: 0 0 10px var(--cyan-glow), 0 0 30px var(--cyan-glow);
        }

        .clock-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .clock-time {
            font-family: var(--font-arcade);
            font-size: 2.6rem;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.55), 0 0 25px rgba(255, 215, 0, 0.3);
            margin-bottom: 0.6rem;
            font-variant-numeric: tabular-nums;
        }

        .quarter-badge {
            font-family: var(--font-arcade);
            font-size: 0.7rem;
            background: rgba(123, 47, 247, 0.15);
            border: 1px solid var(--purple);
            color: var(--text-main);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 0.9rem;
            cursor: pointer;
            animation: pulse-glow 2s ease-in-out infinite;
            transition: transform var(--transition);
        }

        .quarter-badge:hover { transform: scale(1.08); }

        .clock-controls {
            display: flex;
            gap: 0.5rem;
        }

        .team-fouls {
            font-size: 0.78rem;
            color: #ff5555;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 0.6rem;
        }

        /* Botones grandes tipo arcade para la mesa de control */
        .btn-scoreboard .btn-content {
            padding: 0.9rem 1.6rem;
            font-size: 1rem;
        }

        /* Main Content Grid — rosters */
        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            overflow-y: hidden;
        }

        .roster-panel {
            padding: 1rem;
            overflow-y: auto;
        }

        .roster-panel:first-child {
            border-right: 1px solid var(--border-soft);
        }

        .roster-header {
            font-size: 0.95rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1px;
            display: flex;
            justify-content: space-between;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--border-soft);
        }

        .player-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .player-info {
            display: flex;
            align-items: center;
            flex: 1;
        }

        .player-number {
            font-family: var(--font-arcade);
            font-weight: 800;
            color: var(--orange);
            width: 34px;
            font-size: 1rem;
        }

        .player-name {
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        .player-stats {
            font-size: 0.7rem;
            color: var(--cyan-accent);
            margin-left: 0.5rem;
            min-width: 50px;
        }

        .action-buttons {
            display: flex;
            gap: 0.3rem;
        }

        .action-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-soft);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            transition: transform 0.1s, background-color var(--transition), box-shadow var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:active {
            transform: scale(0.9) translateY(1px);
        }

        .action-btn.pts-btn:hover { background-color: var(--cyan-accent); border-color: var(--cyan-accent); color: var(--bg-darker); box-shadow: 0 0 12px var(--cyan-glow); }
        .action-btn.reb-btn:hover { background-color: var(--purple); border-color: var(--purple); box-shadow: 0 0 12px var(--purple-glow); }
        .action-btn.ast-btn:hover { background-color: var(--orange); border-color: var(--orange); box-shadow: 0 0 12px var(--orange-glow); }
        .action-btn.foul-btn:hover { background-color: #ff3333; border-color: #ff3333; box-shadow: 0 0 12px rgba(255, 51, 51, 0.5); }

        /* Footer de control (finalizar partido) */
        .control-footer {
            background-color: var(--card-bg);
            padding: 1rem;
            text-align: center;
            border-top: 2px solid var(--border-soft);
        }

        #loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            font-family: var(--font-arcade);
            color: var(--cyan-accent);
            text-shadow: 0 0 15px var(--cyan-glow);
        }

        /* ==========================================================================
           Responsividad específica del marcador
           ========================================================================== */

        @media (max-width: 860px) {
            .scoreboard {
                flex-wrap: wrap;
            }
            .team-score { flex: 1 1 40%; }
            .clock-section { order: -1; flex: 1 1 100%; margin-bottom: 0.5rem; }
        }

        @media (max-width: 640px) {
            main { grid-template-columns: 1fr; overflow-y: auto; }
            body { overflow: auto; }
            .roster-panel:first-child { border-right: none; border-bottom: 1px solid var(--border-soft); }
            .score-number { font-size: 3rem; }
            .clock-time { font-size: 2rem; }
            .team-score { flex: 1 1 100%; }
            .player-name { max-width: 100px; }
            .btn-scoreboard .btn-content { padding: 0.7rem 1.1rem; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div id="loading-overlay">Cargando Mesa...</div>

    <header>
        <a href="/" class="logo">RETRO HOOPS</a>
        <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-wrapper" id="nav-wrapper">
            <nav class="main-nav">
                <a href="/">Inicio</a>
                <a href="/ligas.html">Ligas</a>
                <a href="/franquicias.html">Franquicias</a>
                <a href="/estadisticas.html">Estadísticas</a>
            </nav>
            <div class="header-actions">
                <span class="badge badge-cyan">MESA DE CONTROL</span>
            </div>
        </div>
    </header>

    <div class="scoreboard-bar">
        <div class="scoreboard">
            <div class="team-score home">
                <div class="team-name" id="home-name">LOCAL</div>
                <div class="score-number" id="home-score-display">0</div>
                <div class="team-fouls">FALTAS: <span id="home-fouls-display">0</span></div>
            </div>

            <div class="clock-section">
                <div class="quarter-badge" id="quarter-display" onclick="nextQuarter()">Q1</div>
                <div class="clock-time" id="clock-display">10:00</div>
                <div class="clock-controls">
                    <button class="btn btn-cyan" id="btn-start" onclick="startClock()"><span class="btn-content">▶ START</span></button>
                    <button class="btn btn-danger" id="btn-pause" onclick="pauseClock()"><span class="btn-content">⏸ PAUSE</span></button>
                </div>
            </div>

            <div class="team-score away">
                <div class="team-name" id="away-name">VISITANTE</div>
                <div class="score-number" id="away-score-display">0</div>
                <div class="team-fouls">FALTAS: <span id="away-fouls-display">0</span></div>
            </div>
        </div>
    </div>

    <main>
        <div class="roster-panel" id="home-roster">
            <!-- Rosters inyectados aquí -->
        </div>
        <div class="roster-panel" id="away-roster">
            <!-- Rosters inyectados aquí -->
        </div>
    </main>

    <footer class="control-footer">
        <button class="btn btn-danger btn-scoreboard" onclick="finishMatchAndSave()"><span class="btn-content">TERMINAR PARTIDO Y GUARDAR</span></button>
    </footer>

    <!-- Script de Toast Externo -->
    <script src="toast.js"></script>
    <script src="/js/nav.js"></script>

    <script>
        // State Management
        let matchId = null;
        let tournamentId = null;
        let clockInterval = null;
        let timeLeft = 600; // 10 minutes in seconds
        let currentQuarter = 1;

        const gameState = {
            homeScore: 0,
            awayScore: 0,
            homeFouls: 0,
            awayFouls: 0,
            players: {} // { 'player_id': { pts: 0, reb: 0, ast: 0, fouls: 0, teamType: 'home' | 'away' } }
        };

        const token = localStorage.getItem('kphoops_token');

        // Formato MM:SS
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateClockDisplay() {
            document.getElementById('clock-display').innerText = formatTime(timeLeft);
        }

        function startClock() {
            if (clockInterval) return;
            clockInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateClockDisplay();
                } else {
                    pauseClock();
                    // Auto-advance quarter or beep sound
                }
            }, 1000);
        }

        function pauseClock() {
            if (clockInterval) {
                clearInterval(clockInterval);
                clockInterval = null;
            }
        }

        function nextQuarter() {
            if (currentQuarter < 4) currentQuarter++;
            else currentQuarter = 'OT';
            document.getElementById('quarter-display').innerText = currentQuarter === 'OT' ? 'OT' : `Q${currentQuarter}`;
            timeLeft = 600; // Reset to 10 mins (or 5 for OT if preferred)
            updateClockDisplay();
            // Resetear faltas de equipo (opcional según reglas)
            gameState.homeFouls = 0;
            gameState.awayFouls = 0;
            updateScoreboard();
        }

        function updateScoreboard() {
            document.getElementById('home-score-display').innerText = gameState.homeScore;
            document.getElementById('away-score-display').innerText = gameState.awayScore;
            document.getElementById('home-fouls-display').innerText = gameState.homeFouls;
            document.getElementById('away-fouls-display').innerText = gameState.awayFouls;
        }

        // Logic for Stats
        function addStat(playerId, type, value, teamType) {
            const p = gameState.players[playerId];
            if (!p) return;

            if (type === 'pts') {
                p.pts += value;
                if (teamType === 'home') gameState.homeScore += value;
                else gameState.awayScore += value;
            } else if (type === 'reb') {
                p.reb += value;
            } else if (type === 'ast') {
                p.ast += value;
            } else if (type === 'foul') {
                p.fouls += value;
                if (teamType === 'home') gameState.homeFouls += value;
                else gameState.awayFouls += value;
            }

            // Update UI
            updateScoreboard();
            document.getElementById(`p-stats-${playerId}`).innerText = `P:${p.pts} R:${p.reb} A:${p.ast} F:${p.fouls}`;
        }

        function renderRoster(team, teamType, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = `<div class="roster-header"><span>${team?.name || 'Equipo'} Roster</span></div>`;

            if (!team || !team.players || team.players.length === 0) {
                container.innerHTML += `<div style="text-align:center; padding: 2rem; color: var(--text-muted);">Sin jugadores.</div>`;
                return;
            }

            team.players.forEach(p => {
                const row = document.createElement('div');
                row.className = 'player-row';
                row.innerHTML = `
                    <div class="player-info">
                        <div class="player-number">${p.jerseyNumber}</div>
                        <div>
                            <div class="player-name">${p.name}</div>
                            <div class="player-stats" id="p-stats-${p.id}">P:0 R:0 A:0 F:0</div>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button class="action-btn pts-btn" onclick="addStat('${p.id}', 'pts', 1, '${teamType}')">+1</button>
                        <button class="action-btn pts-btn" onclick="addStat('${p.id}', 'pts', 2, '${teamType}')">+2</button>
                        <button class="action-btn pts-btn" onclick="addStat('${p.id}', 'pts', 3, '${teamType}')">+3</button>
                        <button class="action-btn reb-btn" onclick="addStat('${p.id}', 'reb', 1, '${teamType}')">REB</button>
                        <button class="action-btn ast-btn" onclick="addStat('${p.id}', 'ast', 1, '${teamType}')">AST</button>
                        <button class="action-btn foul-btn" onclick="addStat('${p.id}', 'foul', 1, '${teamType}')">F</button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // Init
        window.onload = async () => {
            const token = localStorage.getItem('kphoops_token');
            if (!token) {
                console.error("No token found");
                document.getElementById('loading-overlay').innerText = 'Error al cargar el partido';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            matchId = urlParams.get('matchId');

            if (!matchId) {
                console.error("Match ID no proporcionado.");
                document.getElementById('loading-overlay').innerText = 'Error al cargar el partido';
                return;
            }

            try {
                const response = await fetch(`/api/matches/${matchId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    const errorMsg = await response.text();
                    console.error(`Error HTTP ${response.status}:`, errorMsg);
                    document.getElementById('loading-overlay').innerText = 'Error al cargar el partido';
                    alert("Error al cargar el partido");
                    return;
                }

                const match = await response.json();
                tournamentId = match.tournamentId;

                document.getElementById('home-name').innerText = match.homeTeam?.name || 'LOCAL';
                document.getElementById('away-name').innerText = match.awayTeam?.name || 'VISITANTE';

                // Mapeo del estado (gameState)
                if (match.homeTeam && match.homeTeam.players) {
                    match.homeTeam.players.forEach(p => {
                        gameState.players[p.id] = { pts: 0, reb: 0, ast: 0, fouls: 0, teamType: 'home' };
                    });
                }

                if (match.awayTeam && match.awayTeam.players) {
                    match.awayTeam.players.forEach(p => {
                        gameState.players[p.id] = { pts: 0, reb: 0, ast: 0, fouls: 0, teamType: 'away' };
                    });
                }

                renderRoster(match.homeTeam, 'home', 'home-roster');
                renderRoster(match.awayTeam, 'away', 'away-roster');

                document.getElementById('loading-overlay').style.display = 'none';

            } catch (err) {
                console.error("Reference/Fetch Error:", err);
                document.getElementById('loading-overlay').innerText = 'Error al cargar el partido';
                alert("Error al cargar el partido");
            }
        };

        // Guardado Final
        async function finishMatchAndSave() {
            if (!confirm('¿Estás seguro de terminar el partido? Esta acción guardará el resultado final y las estadísticas de todos los jugadores.')) {
                return;
            }

            pauseClock();

            // Build stats array
            const statsPayload = [];
            for (const [playerId, data] of Object.entries(gameState.players)) {
                statsPayload.push({
                    playerId: playerId,
                    points: parseInt(data.pts, 10) || 0,
                    rebounds: parseInt(data.reb, 10) || 0,
                    assists: parseInt(data.ast, 10) || 0,
                    minutesPlayed: parseInt((40 - Math.floor(timeLeft/60)), 10) || 0
                });
            }

            try {
                // 1. Guardar Score Global y cambiar status
                const scoreRes = await fetch(`/api/matches/${matchId}/score`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ homeScore: gameState.homeScore, awayScore: gameState.awayScore })
                });

                if (!scoreRes.ok) throw new Error("Error guardando el marcador.");

                // 2. Guardar Boxscore
                if (statsPayload.length > 0) {
                    console.log("Enviando stats:", { stats: statsPayload });
                    const statsRes = await fetch(`/api/matches/${matchId}/boxscore`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ stats: statsPayload })
                    });

                    if (!statsRes.ok) {
                        const errorMsg = await statsRes.text();
                        console.error("Error del backend:", errorMsg);
                        throw new Error("Error guardando las estadísticas individuales.");
                    }
                }

                showToast('Partido finzalizado y guardado con éxito.', 'success');

                // Redirigir de vuelta al torneo solo tras éxito en ambas peticiones
                setTimeout(() => {
                    window.location.href = `/torneo.html?id=${tournamentId}`;
                }, 2000);

            } catch (err) {
                console.error(err);
                showToast(err.message, 'error');
            }
        }
    </script>
</body>
</html>
