<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Retro Hoops</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
    <header>
        <a href="/" class="logo">RETRO HOOPS</a>
        <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-wrapper" id="nav-wrapper">
            <nav class="main-nav">
                <a href="/">Inicio</a>
                <a href="/ligas.html">Ligas</a>
                <a href="/franquicias.html">Franquicias</a>
                <a href="/estadisticas.html">Estadísticas</a>
            </nav>
            <div class="header-actions">
                <span id="user-greeting" class="user-greeting"></span>
                <a href="/login.html" class="btn" id="btn-login" style="display: none;"><span class="btn-content">Iniciar Sesión</span></a>
                <a href="/registro.html" class="btn btn-cyan" id="btn-register"><span class="btn-content">Registrarse</span></a>
                <button class="btn btn-ghost" id="btn-logout" style="display: none;"><span class="btn-content">Cerrar Sesión</span></button>
            </div>
        </div>
    </header>

    <div class="container-narrow fade-in-up">
        <h1><span class="float-ball">🏀</span> INICIAR SESIÓN</h1>
        
        <form id="login-form">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div style="position: relative;">
                    <input type="password" id="password" name="password" style="width: 100%; padding-right: 40px;" required>
                    <button type="button" id="toggle-pwd" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.2rem; padding: 0;">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Entrar</button>
        </form>
        
        <a href="/registro.html" class="back-link">¿No tienes cuenta? Regístrate</a>
    </div>

    <script src="/toast.js"></script>
    <script src="/js/nav.js"></script>
    <script>
        // 1. Lógica para el botón de Mostrar/Ocultar Contraseña
        const togglePwdBtn = document.getElementById('toggle-pwd');
        const pwdInput = document.getElementById('password');

        if (togglePwdBtn && pwdInput) {
            togglePwdBtn.addEventListener('click', () => {
                const isPassword = pwdInput.getAttribute('type') === 'password';
                pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
                togglePwdBtn.textContent = isPassword ? '🙈' : '👁️';
            });
        }

        // 2. Lógica de Inicio de Sesión Seguro (con Cookies)
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    if (typeof showToast === 'function') showToast('Inicio de sesión exitoso', 'success');
                    
                    // Redirección directa al panel de administración después de 1 segundo
                    setTimeout(() => {
                        window.location.href = '/ligas.html';
                    }, 1000);
                } else {
                    if (typeof showToast === 'function') {
                        showToast(data.error || 'Error al iniciar sesión', 'error');
                    } else {
                        alert(data.error || 'Error al iniciar sesión');
                    }
                }
            } catch (error) {
                console.error("Error en la petición:", error);
            }
        });
    </script>
</body>
</html>
