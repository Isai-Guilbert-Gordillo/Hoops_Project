<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Franquicias - Retro Hoops</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        /* Tarjeta de franquicia: diseño horizontal y compacto (logo + datos en
           fila), en vez de una tarjeta alta y centrada con mucho espacio vacío. */
        .card.team-card {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            text-align: left;
            padding: 1.1rem 1.4rem;
            cursor: pointer;
        }

        /* Fila superior: logo + nombre/capitán. Siempre a todo lo ancho de la
           tarjeta, para que el nombre nunca tenga que competir por espacio
           con los botones de Editar/Eliminar (que van en su propia fila). */
        .team-card-main {
            display: flex;
            align-items: center;
            gap: 1rem;
            min-width: 0;
        }

        .team-logo {
            width: 56px;
            height: 56px;
            flex-shrink: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--card-bg-2);
            object-fit: cover;
            border: 2px solid var(--orange);
            overflow: hidden;
        }

        .team-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .team-logo-placeholder {
            font-family: var(--font-arcade);
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .card.team-card .team-info { min-width: 0; }

        .card.team-card h2 {
            margin: 0 0 0.2rem 0;
            color: var(--orange);
            font-size: 1.05rem;
            text-transform: uppercase;
            font-weight: 800;
            line-height: 1.3;
            overflow-wrap: break-word;
        }

        .card.team-card p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.85rem;
            line-height: 1.3;
            overflow-wrap: break-word;
        }

        /* Nombre del capitán: gris claro legible en vez de cian, que sobre el
           fondo morado oscuro no pasa contraste y cansa la vista. El color
           llamativo se reserva para títulos y elementos interactivos. */
        .captain-name {
            color: #d1d5db;
            font-weight: 600;
        }

        /* Acciones del capitán (Editar/Eliminar): en su propia fila, alineadas
           a la derecha, solo visibles para quien capitanea la franquicia. */
        .team-card-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: flex-end;
            padding-top: 0.6rem;
            border-top: 1px solid var(--border-soft);
        }

        /* Tarjeta "Añadir franquicia": primer elemento del mismo grid, con
           borde punteado (patrón estándar de "add new" en apps modernas),
           en vez de un botón suelto flotando entre el título y la grilla. */
        .add-team-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            min-height: 88px;
            padding: 1.1rem 1.4rem;
            background: transparent;
            border: 2px dashed rgba(255, 46, 159, 0.4);
            border-radius: var(--radius);
            color: var(--pink);
            cursor: pointer;
            text-decoration: none;
            transition: all var(--transition);
        }

        .add-team-card:hover {
            border-color: var(--pink);
            background: rgba(255, 46, 159, 0.06);
        }

        .add-team-card .add-icon {
            font-size: 1.5rem;
            line-height: 1;
        }

        .add-team-card .add-label {
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">RETRO HOOPS</a>
        <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-wrapper" id="nav-wrapper">
            <nav class="main-nav">
                <a href="/">Inicio</a>
                <a href="/ligas.html">Ligas</a>
                <a href="/franquicias.html">Franquicias</a>
                <a href="/estadisticas.html">Estadísticas</a>
            </nav>
            <div class="header-actions">
                <span id="user-greeting" class="user-greeting"></span>
                <a href="/login.html" class="btn" id="btn-login"><span class="btn-content">Iniciar Sesión</span></a>
                <a href="/registro.html" class="btn btn-cyan" id="btn-register"><span class="btn-content">Registrarse</span></a>
                <button class="btn btn-ghost" id="btn-logout" style="display: none;"><span class="btn-content">Cerrar Sesión</span></button>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title fade-in-up" style="margin-bottom: 2rem;">DIRECTORIO DE <span>FRANQUICIAS</span></h1>

        <div class="cards-grid reveal" id="teams-container">
            <!-- Dynamic content goes here -->
             <p style="color: var(--text-muted); grid-column: 1 / -1;">Cargando franquicias...</p>
        </div>
    </div>

    <!-- Ventana flotante para editar una franquicia: centrada, con fondo
         desenfocado (misma clase compartida .modal-overlay/.modal-box de theme.css). -->
    <div class="modal-overlay" id="edit-team-modal" style="display: none;">
        <div class="modal-box">
            <div class="modal-header">
                <h3 class="modal-title">Editar Franquicia</h3>
                <button type="button" class="modal-close-btn" id="edit-team-close" aria-label="Cerrar">&times;</button>
            </div>
            <form id="edit-team-form">
                <div class="form-group">
                    <label for="edit-team-name">Nombre de la Franquicia</label>
                    <input type="text" id="edit-team-name" required>
                </div>
                <div class="form-group">
                    <label for="edit-team-logo">URL del Logo (opcional)</label>
                    <input type="url" id="edit-team-logo" placeholder="https://ejemplo.com/logo.png">
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn-submit">Guardar Cambios</button>
                    <button type="button" class="btn btn-ghost" id="edit-team-cancel"><span class="btn-content">Cancelar</span></button>
                </div>
            </form>
        </div>
    </div>

    <footer class="site-footer">
        <span class="footer-logo">RETRO HOOPS</span>
        <div class="footer-links">
            <a href="/">Inicio</a>
            <a href="/franquicias.html" class="active">Franquicias</a>
            <a href="/ligas.html">Ligas</a>
            <a href="/estadisticas.html">Estadísticas</a>
            <a href="/crear-torneo.html">Nuevo Torneo</a>
        </div>
        <p>&copy; 2026 Retro Hoops. Todos los derechos reservados.</p>
    </footer>

    <script src="/toast.js"></script>
    <script src="/js/nav.js"></script>
    <script>
        let currentUserId = null;
        let allTeams = [];

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const meRes = await fetch('/api/auth/me', { credentials: 'include' });
                if (meRes.ok) {
                    const meData = await meRes.json();
                    currentUserId = meData?.user?.id || null;
                } else {
                    currentUserId = null;
                }
            } catch (error) {
                console.error('No se pudo validar sesión activa:', error);
                currentUserId = null;
            }

            await fetchTeams();
        });

        async function fetchTeams() {
            try {
                const response = await fetch('/api/teams', { credentials: 'include' });
                const teams = await response.json();
                allTeams = teams;

                const container = document.getElementById('teams-container');
                container.innerHTML = ''; // Limpiar preloader

                // Tarjeta "Añadir Franquicia": primer elemento del grid, con
                // borde punteado, en vez de un botón suelto sobre el título.
                const addCard = document.createElement('a');
                addCard.href = 'crear-equipo.html';
                addCard.className = 'add-team-card';
                addCard.innerHTML = `
                    <span class="add-icon">+</span>
                    <span class="add-label">Nueva Franquicia</span>
                `;
                container.appendChild(addCard);

                if (teams.length === 0) {
                    const emptyMsg = document.createElement('p');
                    emptyMsg.style.cssText = 'color: var(--text-muted); grid-column: 1 / -1;';
                    emptyMsg.textContent = 'Aún no hay franquicias registradas. ¡Sé el primero!';
                    container.appendChild(emptyMsg);
                    return;
                }

                teams.forEach(team => {
                    const card = document.createElement('div');
                    card.className = 'card team-card';
                    card.style.cursor = 'pointer';
                    card.onclick = () => {
                        window.location.href = `equipo.html?id=${team.id}`;
                    };

                    // Manejar imagen vs placeholder
                    let logoHtml = '';
                    if (team.logoUrl) {
                        logoHtml = `<div class="team-logo"><img src="${team.logoUrl}" alt="Logo ${team.name}" onerror="this.outerHTML='<span class=\\'team-logo-placeholder\\'>?</span>'"></div>`;
                    } else {
                        logoHtml = `<div class="team-logo"><span class="team-logo-placeholder">?</span></div>`;
                    }

                    // Extraer capitan
                    const captainStr = team.captain ? capitalizeName(`${team.captain.firstName} ${team.captain.lastName}`) : 'No Asignado';

                    // Solo el capitán de la franquicia ve sus propios botones de Editar/Eliminar
                    let actionsHtml = '';
                    if (currentUserId && team.captainId === currentUserId) {
                        actionsHtml = `
                            <div class="team-card-actions">
                                <button class="btn btn-ghost-cyan btn-sm" onclick="editTeam(event, '${team.id}')"><span class="btn-content">Editar</span></button>
                                <button class="btn btn-danger btn-sm" onclick="deleteTeam(event, '${team.id}')"><span class="btn-content">Eliminar</span></button>
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <div class="team-card-main">
                            ${logoHtml}
                            <div class="team-info">
                                <h2>${team.name}</h2>
                                <p>Capitán: <span class="captain-name">${captainStr}</span></p>
                            </div>
                        </div>
                        ${actionsHtml}
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                console.error("Error al cargar las franquicias:", error);
                document.getElementById('teams-container').innerHTML =
                    `<p style="color: var(--orange); grid-column: 1 / -1;">Error al cargar el directorio de franquicias.</p>`;
            }
        }

        // --- Ventana flotante para editar una franquicia ---
        const editTeamModal = document.getElementById('edit-team-modal');
        const editTeamForm = document.getElementById('edit-team-form');
        let editingTeamId = null;

        const closeEditTeamModal = () => { editTeamModal.style.display = 'none'; editingTeamId = null; };

        document.getElementById('edit-team-close').addEventListener('click', closeEditTeamModal);
        document.getElementById('edit-team-cancel').addEventListener('click', closeEditTeamModal);
        editTeamModal.addEventListener('click', (e) => { if (e.target === editTeamModal) closeEditTeamModal(); });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && editTeamModal.style.display !== 'none') closeEditTeamModal();
        });

        editTeamForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!editingTeamId) return;

            fetch(`/api/teams/${editingTeamId}`, {
                method: 'PUT',
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: document.getElementById('edit-team-name').value,
                    logoUrl: document.getElementById('edit-team-logo').value
                })
            })
            .then(res => res.json().then(data => ({ status: res.status, data })))
            .then(({ status, data }) => {
                if (status !== 200) throw new Error(data.error || 'Error al actualizar la franquicia');
                showToast('Franquicia actualizada', 'success');
                closeEditTeamModal();
                setTimeout(() => window.location.reload(), 800);
            })
            .catch(err => showToast(err.message, 'error'));
        });

        function editTeam(event, id) {
            event.stopPropagation(); // Evita que se dispare el onclick de la tarjeta (navegar al equipo)

            const team = allTeams.find(t => t.id === id);
            if (!team) return;

            editingTeamId = id;
            document.getElementById('edit-team-name').value = team.name || '';
            document.getElementById('edit-team-logo').value = team.logoUrl || '';
            editTeamModal.style.display = 'flex';
        }

        function deleteTeam(event, id) {
            event.stopPropagation();

            if (!confirm('¿Estás seguro de que deseas ELIMINAR esta franquicia? Esta acción no se puede deshacer.')) {
                return;
            }

            fetch(`/api/teams/${id}`, {
                method: 'DELETE',
                credentials: 'include'
            })
            .then(res => res.json().then(data => ({ status: res.status, data })))
            .then(({ status, data }) => {
                if (status !== 200) throw new Error(data.error || 'Error al eliminar la franquicia');
                showToast('Franquicia eliminada', 'success');
                setTimeout(() => window.location.reload(), 1000);
            })
            .catch(err => showToast(err.message, 'error'));
        }
    </script>
</body>
</html>
